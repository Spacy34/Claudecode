# Configuration globale du studio. Chaque valeur peut être surchargée par
# variable d'environnement STUDIO_<SECTION>_<KEY> (ex: STUDIO_RENDER_DEFAULT_PROFILE=draft).

[paths]
episodes_dir = "episodes"
cache_dir = ".studio_cache"          # rendus de plans réutilisables (clé = hash du plan)
assets_dir = "assets"
memory_dir = "memory"

[blender]
# "auto"   : binaire `blender` (BLENDER_BIN ou PATH) s'il existe, sinon module Python `bpy`
# "binary" : impose le binaire Blender (recommandé sur un poste avec GPU : EEVEE disponible)
# "module" : impose le module pip `bpy` (headless, Cycles CPU)
mode = "auto"
binary = ""
min_version = "4.2"

[render]
default_profile = "preview"
# Profils utilisés par les étapes automatiques (studio run). Petit VPS : "draft" pour aller vite,
# puis rendu final sur une machine plus puissante.
prototype_profile = "preview"
first_cut_profile = "auto"       # "auto" = même qualité que le rendu final : le final ne fait plus que remonter la vidéo
final_profile = "final"          # petit VPS : "preview" (540x960 rendu, agrandi en 1080x1920 à l'export)
fps = 30
# moteur : "auto" choisit EEVEE si un GPU est utilisable par Blender, sinon Cycles CPU.
engine = "auto"

[limits]
max_parallel_renders = 0        # processus Blender simultanés ; 0 = auto (2 sur carte graphique, 1 sur processeur)
shot_timeout_s = 3600           # au-delà, le plan est marqué failed
max_cache_gb = 20               # purge LRU au-delà (studio cache --prune)
max_ram_gb = 0                  # 0 = 75 % de la RAM détectée
max_threads = 0                 # 0 = tous les cœurs ; sinon limite Cycles
max_external_faces = 150000     # au-delà, un modèle externe est refusé (rendu trop lourd)

[tts]
# "auto" : piper si un modèle .onnx est configuré et installé, sinon espeak-ng (qualité robotique, dev/test uniquement)
backend = "auto"
piper_model = ""                 # chemin vers ex: assets/voices/fr_FR-xxx-medium.onnx (vérifier la licence de la voix)
# synchro des mots : "auto" = Whisper (faster-whisper) s'il est installé, sinon proportionnel aux syllabes ; "off"
align = "auto"
whisper_model = "small"          # small (~460 Mo, précis en français) ; base (~150 Mo, plus rapide)
espeak_voice = "fr+m3"
espeak_speed = 165
# backend "command" : adaptateur générique pour un TTS externe facultatif.
# {text_file} et {out_wav} sont substitués. Aucune clé ne doit être écrite ici : utiliser l'environnement.
command = ""

[audio]
sample_rate = 48000
target_lufs = -14.0
true_peak_db = -1.5
music_gain_db = -24.0
sfx_gain_db = -15.0             # bruitages du script (relatif) : discrets sous la voix
script_sfx_max_db = -15.0       # plafond : un bruitage écrit dans le script ne dépasse jamais ce niveau
auto_sfx = "discret"             # bruitages automatiques : "discret" (impacts, notifications, messages), "complet", "aucun"
lead_in_s = 0.25
tail_s = 0.4                       # silence après la dernière réplique (court : la vidéo boucle)

[subtitles]
font_family = "Inter ExtraBold"
font_size_ratio = 0.050          # taille police / hauteur image
words_per_chunk = 3
max_chars_per_chunk = 22
vertical_position = 0.68         # 0 = haut, 1 = bas (zone sûre TikTok : éviter > 0.80)
highlight_color = "&H0000E5FF"   # ASS BGR : jaune
base_color = "&H00FFFFFF"

[grade]
# Étalonnage par ambiance au montage (contraste, température, vignettage) ; strength 0 à 1.5
enabled = true
strength = 1.0
vignette = true

[loop]
# Fin qui boucle (TikTok relance la vidéo) : dernières images fondues dans la 1re, musique coupée net (pas de fondu),
# pas de fondu au noir final ; `loop_to_start` sur le dernier plan reprend le cadrage du premier.
enabled = true
blend_frames = 6

[hook]
# Accroche des 2 premières secondes (rétention TikTok), appliquée automatiquement :
# titre à l'écran (story_script.hook.on_screen_text, sinon le titre), caméra jamais fixe au 1er plan.
# sound = son d'attaque à 0 s (désactivé : trop fort ; le titre d'accroche apparaît aussi sans bruit)
title = true
sound = false
first_shot_move = true
max_first_shot_s = 2.5

[quality]
# Mode autonome : true = plus AUCUNE validation humaine. Les gates sont validées automatiquement par
# `studio run` dès que les critiques ont approuvé (sans bloquant) et que la QA technique n'est pas bloquante,
# et le rendu final s'enchaîne. La publication reste manuelle dans tous les cas.
autonomous = false
human_gates = ["gate_script", "gate_lookdev", "gate_prototype", "gate_first_cut"]   # ignoré si autonomous = true
max_revision_rounds = 2          # tours de correction par revue / validation
preflight_on_submit = true       # storyboard / animation : contrôles (dont 3D sans rendu) dès la soumission
framing_balance = true           # élargit automatiquement des plans trop serrés (décor visible) : voir compile.balance_framings
min_open_ratio = 0.4             # part minimale de plans où le décor se lit (wide, full, two_shot)
# Budget épuisé : "continue" = on avance AVEC RÉSERVES (listées dans episode_manifest.json) ; "stop" = arrêt pour
# l'humain. Un problème de droits/décision (fix_owner human) arrête toujours, immédiatement.
on_budget_exhausted = "continue"
min_dimension_score = 6          # un score < seuil sur une dimension critique bloque
blocker_severities = ["blocker"]
