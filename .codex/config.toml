# Configuration Codex du projet (couche projet : chargée uniquement si le dossier est marqué « trusted »).
# Clés vérifiées contre le schéma officiel codex-rs/core/config.schema.json
# (copie épinglée : references/codex/config.schema.json, commit dans references/codex/SOURCE_COMMIT).
# Test automatique : tests/test_codex_config.py.
#
# Modèle : volontairement NON figé ici. Codex utilise le modèle par défaut de votre compte.
# Pour en imposer un (après vérification avec `codex` → /model), décommenter :
# model = "<identifiant-modele-disponible>"

approval_policy = "on-request"     # l'agent demande avant toute action hors sandbox
sandbox_mode = "workspace-write"   # écriture limitée au dépôt ; pas de danger-full-access par défaut

[sandbox_workspace_write]
network_access = false             # le pipeline est local ; l'installation (scripts/install.sh) se lance hors Codex

[agents]
# Sous-agents natifs. Rendus Blender = 1 processus lourd : inutile de lancer plus de 4 agents en parallèle.
max_concurrent_threads_per_session = 4
max_depth = 1                      # pas de sous-agent qui relance des sous-agents
# default_subagent_reasoning_effort = "medium"
# default_subagent_model = "<identifiant-modele>"

[features]
multi_agent = true

# Note : les [profiles] ne sont pas acceptés dans une config de PROJET par Codex (avertissement constaté) ;
# les définir dans ~/.codex/config.toml si besoin. Le modèle se choisit dans config/local.toml [codex] model
# (utilisé par scripts/produire.sh) ou dans ~/.codex/config.toml.
